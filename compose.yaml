services:
  api:
    build: { context: ., dockerfile: Dockerfile.api }
    restart: unless-stopped
    environment:
      BIND_ADDR: 0.0.0.0:3000
      DATABASE_URL: sqlite:///data/nullbox.db
      CORS_ALLOWED_ORIGINS: https://team-04.fasthacks.cloud
      PUBLIC_WEB_URL: https://team-04.fasthacks.cloud
      ADMIN_TOKEN: ${ADMIN_TOKEN:-testadmintoken}
      RUST_LOG: info,tower_http=info
      # OpenTelemetry export. Values come from the host's environment or the `.env` next to this file;
      # empty (the default) keeps export off. The API key stays out of the repository.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: nullbox-api
    volumes: [ "api-data:/data" ]
  web:
    build: { context: ., dockerfile: Dockerfile.web }
    restart: unless-stopped
    ports: [ "80:80", "443:443" ]
    volumes: [ "caddy-data:/data", "caddy-config:/config" ]
    depends_on: [ api ]
volumes:
  api-data:
  caddy-data:
  caddy-config:
